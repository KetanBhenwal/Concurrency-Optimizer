services:
  - type: web
    name: seat-reservation-api
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true

databases:
  - name: seat-reservation-db
    databaseName: seat_reservation
    user: seat_reservation
    postgresMajorVersion: "16"
    region: oregon
    plan: free
    ipAllowList: []